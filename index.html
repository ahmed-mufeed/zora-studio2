<!doctype html>
<!-- تحديد لغة الموقع بالعربية والاتجاه من اليمين إلى اليسار -->
<html lang="ar" dir="rtl">
  <head>
    <!-- ترميز الحروف العالمي لدعم اللغة العربية بدون مشاكل -->
    <meta charset="UTF-8" />
    
    <!-- ضبط أبعاد وتجاوب الصفحة مع شاشات الهواتف والأجهزة المختلفة -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- الوصف التعريفي للموقع لمحركات البحث ومواقع التواصل -->
    <meta name="description" content="زورا استوديو — استوديو تسويق رقمي وتصميم. إبداع يضرب كالصاعقة." />
    
    <!-- لون شريط المتصفح العلوي على الهواتف الذكية -->
    <meta name="theme-color" content="#131319" />
    
    <!-- تسريع الاتصال بخوادم خطوط Google Fonts مسبقاً -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- استيراد خطي Cairo (للنصوص العربية) و Space Grotesk (للأرقام والرموز اللاتينية) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900;1000&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- عنوان الموقع في شريط التبويب -->
    <title>زورا استوديو | ZORA STUDIO</title>
  </head>
  <body>
    <!-- الحاوية الأساسية التي يتم حقن وبناء كامل تطبيق React بداخلها -->
    <div id="root"></div>
    
    <!-- استدعاء ملف نقطة الانطلاق والتشغيل الرئيسي للتطبيق -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
